import java.util.jar.JarEntry
import java.util.jar.JarFile
import java.util.jar.JarOutputStream

import static java.util.Collections.list

plugins {
	id 'java'
	id 'idea'
	id 'org.jetbrains.kotlin.jvm'
	id 'org.jetbrains.kotlin.kapt'
}

kotlin {
	jvmToolchain(17)
}

def kaptJvmArgs = [
	"--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED",
	"--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED",
	"--add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED",
	"--add-exports=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED",
	"--add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED",
	"--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED",
	"--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED",
	"--add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED",
]

tasks.withType(KotlinCompile).configureEach {
	kotlinOptions {
		jvmTarget = "17"
	}
	if (hasProperty("kotlinDaemonJvmArgs")) {
		kotlinDaemonJvmArgs.addAll(kaptJvmArgs)
	}
	if (hasProperty("kotlinDaemonJvmArguments")) {
		kotlinDaemonJvmArguments.addAll(kaptJvmArgs)
	}
}

kapt {
	javacOptions {
		option("-J--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED")
		option("-J--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED")
		option("-J--add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED")
		option("-J--add-exports=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED")
		option("-J--add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED")
		option("-J--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED")
		option("-J--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED")
		option("-J--add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED")
	}
}

def kaptStubsClass = null
def kaptWithoutKotlincClass = null
try {
	kaptStubsClass = Class.forName("org.jetbrains.kotlin.gradle.internal.KaptGenerateStubsTask")
	kaptWithoutKotlincClass = Class.forName("org.jetbrains.kotlin.gradle.internal.KaptWithoutKotlincTask")
} catch(Exception ignored) {
	logger.lifecycle("Kapt task classes not found at configuration time; JVM args wiring may be skipped")
}

[kaptStubsClass, kaptWithoutKotlincClass].findAll { it != null }.each { kaptClass ->
	tasks.withType((Class) kaptClass).configureEach {
		if (it.hasProperty("kotlinOptions")) {
			it.kotlinOptions.jvmTarget = "17"
		}
		if (it.hasProperty("kaptProcessJvmArgs")) {
			it.kaptProcessJvmArgs.addAll(kaptJvmArgs)
		}
		if (it.hasProperty("kotlinDaemonJvmArgs")) {
			it.kotlinDaemonJvmArgs.addAll(kaptJvmArgs)
		}
		if (it.hasProperty("kotlinDaemonJvmArguments")) {
			it.kotlinDaemonJvmArguments.addAll(kaptJvmArgs)
		}
	}
}

def disableWitnessFlag = (rootProject.findProperty('briar.disableWitness')
	?: System.getProperty('briar.disableWitness')
	?: System.getenv('BRIAR_DISABLE_WITNESS'))?.toString()?.toBoolean()

if (!(disableWitnessFlag ?: false)) {
	apply plugin: 'witness'
	apply from: 'witness.gradle'
} else {
	logger.lifecycle("Skipping Witness dependency verification for ${project.path}")
}

