apply plugin: 'java-library'
sourceCompatibility = 1.8
targetCompatibility = 1.8

apply plugin: 'ru.vyarus.animalsniffer'

def disableWitnessFlag = (rootProject.findProperty('briar.disableWitness')
	?: System.getProperty('briar.disableWitness')
	?: System.getenv('BRIAR_DISABLE_WITNESS'))?.toString()?.toBoolean()

if (!(disableWitnessFlag ?: false)) {
	apply plugin: 'witness'
	apply from: 'witness.gradle'
} else {
	logger.lifecycle("Skipping Witness dependency verification for ${project.path}")
}

dependencies {
	api 'org.briarproject:null-safety:0.1'
	api 'com.google.code.findbugs:jsr305:3.0.2'
	api 'javax.inject:javax.inject:1'
	api "com.google.dagger:dagger:$dagger_version"

	implementation "com.fasterxml.jackson.core:jackson-annotations:$jackson_version"

	testImplementation "junit:junit:$junit_version"
	testImplementation "org.jmock:jmock:$jmock_version"
	testImplementation "org.jmock:jmock-junit4:$jmock_version"

	signature 'org.codehaus.mojo.signature:java16:1.1@signature'
}

// needed to make test output available to bramble-core and briar-core
configurations {
	testOutput.extendsFrom(testImplementation)
}
tasks.register('jarTest', Jar) {
	dependsOn(tasks.named('testClasses'))
	from(sourceSets.test.output, sourceSets.main.output)
	archiveClassifier.set('test')
}
artifacts {
	testOutput(tasks.named('jarTest'))
}
